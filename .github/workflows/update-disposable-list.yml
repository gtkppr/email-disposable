name: Update disposable email list

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

concurrency:
  group: update-disposable-list
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync branch
        run: |
          branch="${GITHUB_REF_NAME:-main}"
          git pull --ff-only origin "$branch"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn fetch

      - name: Bump package version
        run: |
          PUBLISHED_VERSION="$(npm view email-disposable version)"
          NEXT_VERSION="$(node -e 'const parts = process.argv[1].split(".").map(Number); if (parts.length !== 3 || parts.some(Number.isNaN)) process.exit(1); console.log(`${parts[0]}.${parts[1]}.${parts[2] + 1}`)' "$PUBLISHED_VERSION")"

          npm pkg set "version=$NEXT_VERSION"
          echo "NEXT_VERSION=$NEXT_VERSION" >> "$GITHUB_ENV"

      - name: Commit changes
        run: |
          git add disposable.json disposable.txt package.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "update disposable domains v$NEXT_VERSION"
          branch="${GITHUB_REF_NAME:-main}"

          if ! git push origin "HEAD:$branch"; then
            git fetch origin "$branch"
            git rebase "origin/$branch"

            if [ "$(git rev-list --count "origin/$branch"..HEAD)" = "0" ]; then
              echo "Remote already contains this update"
              exit 0
            fi

            git push origin "HEAD:$branch"
          fi

      - name: Check whether package needs publishing
        id: publish_check
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          PUBLISHED_VERSIONS="$(npm view email-disposable versions --json)"
          PUBLISH_PACKAGE="$(node -e '
            const versions = JSON.parse(process.argv[1]);
            if (!Array.isArray(versions)) throw new Error("Expected an array of published versions");
            console.log(!versions.includes(process.argv[2]));
          ' "$PUBLISHED_VERSIONS" "$PACKAGE_VERSION")"

          echo "Package version: $PACKAGE_VERSION"
          echo "Publish package: $PUBLISH_PACKAGE"
          echo "publish=$PUBLISH_PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Publish package
        if: steps.publish_check.outputs.publish == 'true'
        run: npm publish --access public --provenance
